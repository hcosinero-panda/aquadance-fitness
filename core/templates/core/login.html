<!DOCTYPE html>
<html lang="en" class="h-full bg-zinc-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Aquadance Fitness Hub</title>
    
    {% load static %}
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        html { scroll-behavior: smooth; }
        body {
            background-image: url('{% static "images/gym_background.jpg.png" %}');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: rgba(0, 0, 0, 0.7);
            background-blend-mode: darken;
        }
    </style>
</head>
<body class="h-full font-sans antialiased text-zinc-200 selection:bg-cyan-500 selection:text-zinc-950 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md">
        <div class="bg-zinc-950/90 backdrop-blur-md border border-zinc-800/50 rounded-2xl p-8 shadow-2xl">
            <!-- Logo -->
            <div class="flex justify-center mb-8">
                <div class="flex items-center gap-3">
                    <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-gradient-to-br from-cyan-500 to-blue-600 text-zinc-950 font-bold shadow-md shadow-cyan-500/10">
                        <i class="fa-solid fa-dumbbell"></i>
                    </div>
                    <div>
                        <span class="text-lg font-bold tracking-wider text-white uppercase block leading-none">Aquadance</span>
                        <span class="text-xs font-semibold text-cyan-400 tracking-widest uppercase mt-0.5 block">Fitness Hub</span>
                    </div>
                </div>
            </div>

            <h1 class="text-2xl font-bold text-center text-white mb-2">Welcome Back</h1>
            <p class="text-center text-sm text-zinc-400 mb-8">Sign in to your account to continue</p>

            <!-- Messages -->
            {% if messages %}
            <div class="mb-6 space-y-2">
                {% for message in messages %}
                <div class="p-4 rounded-xl {% if message.tags %}bg-{{ message.tags }}-950/30 border border-{{ message.tags }}-500/30 text-{{ message.tags }}-400{% else %}bg-red-950/30 border border-red-500/30 text-red-400{% endif %} text-sm flex items-center gap-2">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <!-- Login Form -->
            <form method="POST" class="space-y-5">
                {% csrf_token %}
                
                <div>
                    <label for="username" class="block text-sm font-medium text-zinc-300 mb-2">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username"
                        required
                        autofocus
                        autocomplete="username"
                        class="w-full px-4 py-2.5 bg-zinc-900/50 border border-zinc-800 rounded-lg text-white placeholder-zinc-500 focus:border-cyan-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/20 transition-colors"
                        placeholder="Enter your username"
                    >
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-zinc-300 mb-2">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password"
                        required
                        autocomplete="current-password"
                        class="w-full px-4 py-2.5 bg-zinc-900/50 border border-zinc-800 rounded-lg text-white placeholder-zinc-500 focus:border-cyan-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/20 transition-colors"
                        placeholder="Enter your password"
                    >
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit"
                    class="w-full py-2.5 mt-6 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white font-semibold rounded-lg transition-all duration-200 shadow-lg shadow-cyan-500/20 hover:shadow-cyan-500/30"
                >
                    <i class="fa-solid fa-sign-in-alt mr-2"></i>Sign In
                </button>
            </form>

            <!-- Footer -->
            <div class="mt-8 pt-6 border-t border-zinc-800/50">
                <p class="text-xs text-center text-zinc-500">
                    Aquadance Fitness Hub © 2024. All rights reserved.
                </p>
            </div>
        </div>

        <!-- Additional Info -->
        <div class="mt-6 text-center text-xs text-zinc-500">
            <p>For system access, contact your administrator</p>
        </div>
    </div>
</body>
</html>

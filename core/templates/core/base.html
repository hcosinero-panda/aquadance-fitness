<!DOCTYPE html>
<html lang="en" class="h-full bg-zinc-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Aquadance Fitness Hub{% endblock %}</title>
    
    {% load static %}
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        html { scroll-behavior: smooth; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

        body {
            background-image: url('{% static "images/gym_background.jpg.png" %}');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: rgba(0, 0, 0, 0.7);
            background-blend-mode: darken;
        }
    </style>
</head>
<body class="h-full font-sans antialiased text-zinc-200 selection:bg-cyan-500 selection:text-zinc-950">
    <div class="flex h-full min-h-screen overflow-hidden">
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-20 flex w-64 flex-col border-r border-zinc-900 bg-zinc-950/80 backdrop-blur-md transition-all duration-300">
            <div class="flex h-16 items-center border-b border-zinc-900 px-6 gap-2.5 justify-between">
                <div id="logo-container" class="flex items-center gap-2.5">
                    <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-cyan-500 to-blue-600 text-zinc-950 font-bold shadow-md shadow-cyan-500/10">
                        <i class="fa-solid fa-dumbbell text-sm"></i>
                    </div>
                    <div id="brand-text">
                        <span class="text-sm font-bold tracking-wider text-white uppercase block leading-none">Aquadance</span>
                        <span class="text-[10px] font-semibold text-cyan-400 tracking-widest uppercase mt-0.5 block">Fitness Hub</span>
                    </div>
                </div>
                <button onclick="toggleSidebar()" class="text-zinc-500 hover:text-white cursor-pointer">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
            
            <nav id="nav-menu" class="flex-1 space-y-1 px-4 py-6 overflow-y-auto">
                <a href="{% url 'dashboard' %}" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium transition-all duration-200 {% if request.resolver_match.url_name == 'dashboard' %} bg-zinc-900 text-cyan-400 border border-zinc-800/80 {% else %} text-zinc-400 hover:bg-zinc-900/50 hover:text-zinc-200 {% endif %}">
                    <i class="fa-solid fa-chart-pie w-5 text-center text-base"></i>
                    <span class="nav-text">Operations Panel</span>
                </a>
                <a href="{% url 'checkin' %}" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-zinc-400 hover:bg-zinc-900/50 hover:text-zinc-200 transition-all duration-200 {% if request.resolver_match.url_name == 'checkin' %} bg-zinc-900 text-cyan-400 border border-zinc-800/80 {% endif %}">
                    <i class="fa-solid fa-qrcode w-5 text-center text-base"></i>
                    <span class="nav-text">QR Check-in</span>
                </a>
                <a href="{% url 'membership_cards' %}" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-zinc-400 hover:bg-zinc-900/50 hover:text-zinc-200 transition-all duration-200">
                    <i class="fa-solid fa-id-card w-5 text-center text-base"></i>
                    <span class="nav-text">Print Cards</span>
                </a>
                <a href="/admin/core/member/" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-zinc-400 hover:bg-zinc-900/50 hover:text-zinc-200 transition-all duration-200">
                    <i class="fa-solid fa-users w-5 text-center text-base"></i>
                    <span class="nav-text">Manage Members</span>
                </a>
                <a href="/admin/" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-zinc-400 hover:bg-zinc-900/50 hover:text-zinc-200 transition-all duration-200">
                    <i class="fa-solid fa-sliders w-5 text-center text-base"></i>
                    <span class="nav-text">System Database</span>
                </a>
            </nav>

            <div class="mt-auto border-t border-zinc-900 p-4 bg-zinc-900/10">
                <div class="flex items-center justify-between rounded-xl p-2 bg-zinc-900/30 border border-zinc-900/50">
                    <div class="flex items-center gap-2.5">
                        <div class="h-8 w-8 rounded-lg bg-zinc-800 border border-zinc-700/50 flex items-center justify-center text-xs font-semibold text-zinc-300">
                            {{ user.username|slice:":2"|upper }}
                        </div>
                        <div class="user-text overflow-hidden">
                            <span class="text-xs font-medium text-white block truncate">{{ user.username }}</span>
                            <span class="text-[10px] text-zinc-500 block">System Administrator</span>
                        </div>
                    </div>
                    {% if user.is_authenticated %}
                        <form method="POST" action="/admin/logout/" class="inline-block m-0">
                            {% csrf_token %}
                            <button type="submit" class="p-1.5 text-zinc-500 hover:text-red-400 transition-colors rounded-lg hover:bg-zinc-800/50 cursor-pointer">
                                <i class="fa-solid fa-power-off text-xs"></i>
                            </button>
                        </form>
                    {% endif %}
                </div>
            </div>
        </aside>

        <main id="main-content" class="flex-1 pl-64 transition-all duration-300 overflow-y-auto">
            <div class="max-w-7xl mx-auto px-8 py-8">
                {% block content %}
                {% endblock %}
            </div>
        </main>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('main-content');
            const brandText = document.getElementById('brand-text');
            const userText = document.querySelector('.user-text');
            const navLabels = document.querySelectorAll('.nav-text');
            
            if (sidebar.classList.contains('w-64')) {
                sidebar.classList.replace('w-64', 'w-16');
                mainContent.classList.replace('pl-64', 'pl-16');
                if(brandText) brandText.style.display = 'none';
                if(userText) userText.style.display = 'none';
                navLabels.forEach(label => label.style.display = 'none');
            } else {
                sidebar.classList.replace('w-16', 'w-64');
                mainContent.classList.replace('pl-16', 'pl-64');
                if(brandText) brandText.style.display = 'block';
                if(userText) userText.style.display = 'block';
                navLabels.forEach(label => label.style.display = 'block');
            }
        }
    </script>
</body>
</html>

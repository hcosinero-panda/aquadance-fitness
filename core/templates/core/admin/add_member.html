{% extends "core/admin/base.html" %}

{% block title %}Add New Member{% endblock %}
{% block page_title %}Add New Member{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-gray-800 rounded-lg p-8 border border-gray-700">
        <form method="POST" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label class="block text-sm font-medium mb-2">First Name *</label>
                <input type="text" name="first_name" required class="w-full bg-gray-700 border border-gray-600 rounded px-4 py-2 text-white">
            </div>
            
            <div>
                <label class="block text-sm font-medium mb-2">Last Name *</label>
                <input type="text" name="last_name" required class="w-full bg-gray-700 border border-gray-600 rounded px-4 py-2 text-white">
            </div>
            
            <div>
                <label class="block text-sm font-medium mb-2">Email</label>
                <input type="email" name="email" class="w-full bg-gray-700 border border-gray-600 rounded px-4 py-2 text-white">
            </div>
            
            <div>
                <label class="block text-sm font-medium mb-2">Phone Number</label>
                <input type="tel" name="phone_number" class="w-full bg-gray-700 border border-gray-600 rounded px-4 py-2 text-white">
            </div>
            
            <div class="flex gap-4 pt-4">
                <button type="submit" class="bg-cyan-600 hover:bg-cyan-700 text-white px-6 py-2 rounded">
                    <i class="fas fa-check"></i> Add Member
                </button>
                <a href="{% url 'manage_members' %}" class="bg-gray-700 hover:bg-gray-600 text-white px-6 py-2 rounded">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
